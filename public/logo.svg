<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="PFM logo">
  <!-- Nền yellow vuông -->
  <rect x="2" y="2" width="60" height="60" fill="#F5D547" stroke="#000000" stroke-width="4"/>
  <!-- Dấu đô la cách điệu: stack 3 "coin" + dấu $ đan -->
  <!-- Đồng xu lớn dưới -->
  <rect x="14" y="36" width="36" height="20" fill="#FFFFFF" stroke="#000000" stroke-width="3"/>
  <line x1="20" y1="42" x2="44" y2="42" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="20" y1="48" x2="44" y2="48" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Đồng xu giữa -->
  <rect x="10" y="20" width="44" height="16" fill="#FF8C42" stroke="#000000" stroke-width="3"/>
  <line x1="16" y1="28" x2="48" y2="28" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Đồng xu trên cùng = dấu $ -->
  <rect x="18" y="4" width="28" height="16" fill="#FFFFFF" stroke="#000000" stroke-width="3"/>
  <text x="32" y="17" font-family="Archivo Black, Georgia, serif" font-size="14" font-weight="900" text-anchor="middle" fill="#000000">$</text>
  <!-- Shadow cứng phía dưới phải -->
  <rect x="6" y="42" width="60" height="20" fill="#000000"/>
  <rect x="10" y="26" width="44" height="16" fill="#000000"/>
  <rect x="18" y="10" width="28" height="16" fill="#000000"/>
  <!-- Layer trên cùng (mặt) phủ lại shadow để tạo sticker nổi -->
  <rect x="2" y="2" width="60" height="60" fill="#F5D547" stroke="#000000" stroke-width="4"/>
  <rect x="14" y="36" width="36" height="20" fill="#FFFFFF" stroke="#000000" stroke-width="3"/>
  <line x1="20" y1="42" x2="44" y2="42" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="20" y1="48" x2="44" y2="48" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="10" y="20" width="44" height="16" fill="#FF8C42" stroke="#000000" stroke-width="3"/>
  <line x1="16" y1="28" x2="48" y2="28" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="18" y="4" width="28" height="16" fill="#FFFFFF" stroke="#000000" stroke-width="3"/>
  <text x="32" y="17" font-family="Archivo Black, Georgia, serif" font-size="14" font-weight="900" text-anchor="middle" fill="#000000">$</text>
</svg>
