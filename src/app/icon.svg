<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="PFM">
  <!-- Background square -->
  <rect x="4" y="6" width="56" height="56" fill="#F5D547" stroke="#000000" stroke-width="4"/>
  <!-- Hard offset shadow -->
  <rect x="8" y="10" width="56" height="56" fill="#000000"/>
  <!-- Re-paint front (covers shadow except the offset) -->
  <rect x="4" y="6" width="56" height="56" fill="#F5D547" stroke="#000000" stroke-width="4"/>
  <!-- Bottom coin -->
  <rect x="14" y="38" width="36" height="20" fill="#FFFFFF" stroke="#000000" stroke-width="3"/>
  <line x1="20" y1="44" x2="44" y2="44" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="20" y1="50" x2="44" y2="50" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Middle coin (orange) -->
  <rect x="10" y="22" width="44" height="16" fill="#FF8C42" stroke="#000000" stroke-width="3"/>
  <line x1="16" y1="30" x2="48" y2="30" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Top coin = $ symbol -->
  <rect x="18" y="10" width="28" height="14" fill="#FFFFFF" stroke="#000000" stroke-width="3"/>
  <text x="32" y="22" font-family="Impact, 'Arial Black', sans-serif" font-size="14" font-weight="900" text-anchor="middle" fill="#000000" letter-spacing="-1">$</text>
</svg>
